services:
  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: sqlite:////data/astrology.db
    volumes:
      - api_data:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api_data:
